apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'com.wz.reader.platform'
version = '1.0.0'

expoModule { canBePublished = false }

android {
  namespace = 'com.wz.reader.platform'
  defaultConfig {
    versionCode = 1
    versionName = '1.0.0'
    consumerProguardFiles('consumer-rules.pro')
  }
  testOptions { unitTests.returnDefaultValues = true }
  sourceSets {
    test.java.srcDir('src/testShared/java')
    test.resources.srcDir('../../../tests/fixtures')
  }
}

def okhttpVersion = '5.5.1'
def conscryptVersion = '2.9.0'
configurations.configureEach {
  if (name.endsWith('UnitTestRuntimeClasspath')) {
    // Plain JVM tests load the public-suffix list from the classpath.
    resolutionStrategy.dependencySubstitution {
      substitute module('com.squareup.okhttp3:okhttp') using module("com.squareup.okhttp3:okhttp-jvm:${okhttpVersion}")
      substitute module('org.conscrypt:conscrypt-android') using module("org.conscrypt:conscrypt-openjdk-uber:${conscryptVersion}")
    }
  }
}

dependencies {
  implementation('com.facebook.react:react-android')
  implementation(platform("com.squareup.okhttp3:okhttp-bom:${okhttpVersion}"))
  implementation('com.squareup.okhttp3:okhttp')
  implementation('com.squareup.okhttp3:okhttp-dnsoverhttps')
  implementation("org.conscrypt:conscrypt-android:${conscryptVersion}")
  implementation('com.squareup.okhttp3:okhttp-urlconnection')
  implementation project(':expo-image')
  implementation project(':expo-video')
  def notifications = new groovy.json.JsonSlurper().parse(file('../../../node_modules/expo-notifications/expo-module.config.json')).android.publication
  implementation("${notifications.groupId}:${notifications.artifactId}:${notifications.version}")
  implementation('androidx.browser:browser:1.10.0')
  implementation('org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2')
  implementation('androidx.webkit:webkit:1.17.0')
  implementation('org.chromium.net:cronet-bundled:500.0.2')
  implementation('com.google.net.cronet:cronet-okhttp:0.1.1') {
    exclude group: 'com.squareup.okhttp3', module: 'okhttp'
    exclude group: 'com.squareup.okio', module: 'okio'
    exclude group: 'org.chromium.net', module: 'cronet-api'
  }
  testImplementation('junit:junit:4.13.2')
  testImplementation('org.robolectric:robolectric:4.16')
  testImplementation('androidx.media3:media3-common:1.9.0')
  testImplementation('io.github.lukmccall.pika:pika-api:0.3.2')
  testImplementation('com.squareup.okhttp3:mockwebserver')
  testImplementation('com.squareup.okhttp3:okhttp-tls')
}
