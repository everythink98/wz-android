buildscript {
  repositories {
    mavenCentral()
  }
  dependencies {
    classpath("org.jetbrains.kotlin.plugin.compose:org.jetbrains.kotlin.plugin.compose.gradle.plugin:${kotlinVersion}")
  }
}

apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'
apply plugin: 'org.jetbrains.kotlin.plugin.compose'

group = 'expo.modules.forumcontentselection'
version = '1.0.0'

expoModule {
  canBePublished false
}

android {
  namespace 'expo.modules.forumcontentselection'
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
  buildFeatures {
    compose true
  }
}

dependencies {
  implementation 'androidx.compose.foundation:foundation-android:1.9.0'
  implementation 'androidx.compose.ui:ui-android:1.9.0'
  implementation 'androidx.compose.ui:ui-text-android:1.9.0'
  testImplementation 'junit:junit:4.13.2'
  testImplementation 'org.json:json:20230227'
}
