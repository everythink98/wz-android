apply plugin: 'com.android.library'
apply plugin: 'expo-module-gradle-plugin'

group = 'expo.modules.forumcontentselection'
version = '1.0.0'

expoModule {
  canBePublished = false
}

android {
  namespace = 'expo.modules.forumcontentselection'
  defaultConfig {
    versionCode = 1
    versionName = '1.0.0'
    testInstrumentationRunner = 'androidx.test.runner.AndroidJUnitRunner'
  }
  packaging {
    jniLibs.pickFirsts += ['**/libc++_shared.so', '**/libfbjni.so']
  }
}

dependencies {
  androidTestImplementation('com.facebook.react:react-android')
  androidTestImplementation('androidx.recyclerview:recyclerview:1.4.0')
  androidTestImplementation('androidx.test.ext:junit:1.3.0')
  androidTestImplementation('androidx.test:core:1.7.0')
  androidTestImplementation('androidx.test:runner:1.7.0')
  testImplementation('junit:junit:4.13.2')
  testImplementation('org.json:json:20260814')
}
