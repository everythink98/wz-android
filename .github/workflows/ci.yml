name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx expo prebuild --platform android --clean --no-install
        env:
          NODE_ENV: production
      - run: ./gradlew :app:testReleaseUnitTest :app:compileReleaseKotlin --no-daemon --console=plain
        working-directory: android
        env:
          NODE_ENV: production
