<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 320 180">
  <defs>
    <linearGradient id="label-gradient" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <style>
    @keyframes reveal { from { opacity: 0; } to { opacity: 1; } }
    .panel { opacity: 0; animation: reveal 120ms linear forwards; }
  </style>
  <g class="panel" filter="url(#soft-shadow)">
    <rect x="20" y="20" width="280" height="140" rx="12" fill="#f8fafc" />
    <text x="40" y="80" font-size="24" fill="url(#label-gradient)">
      <tspan>Chromium SVG document</tspan>
    </text>
    <circle cx="52" cy="124" r="8" fill="#22c55e">
      <animate attributeName="cx" values="52;268;52" dur="800ms" repeatCount="indefinite" />
    </circle>
    <image x="272" y="32" width="16" height="16" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCAxIDEiPjxyZWN0IHdpZHRoPSIxIiBoZWlnaHQ9IjEiIGZpbGw9IiNmOTczMTYiLz48L3N2Zz4=" />
  </g>
</svg>
